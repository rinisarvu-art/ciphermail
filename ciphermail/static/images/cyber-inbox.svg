<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="220" height="170" fill="none">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A30"/>
      <stop offset="100%" stop-color="#050C18"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Neon Floor Grid -->
  <ellipse cx="150" cy="170" rx="100" ry="28" fill="#030712" stroke="#00D2FF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <ellipse cx="150" cy="170" rx="70" ry="20" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Isometric Encrypted Data Cube / Envelope -->
  <rect x="75" y="70" width="150" height="96" rx="12" fill="url(#boxGrad)" stroke="#00D2FF" stroke-width="1.8" filter="url(#cyanGlow)"/>
  
  <!-- Envelope V-Flap -->
  <path d="M77 74 L150 125 L223 74" stroke="#00D2FF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  
  <!-- Glowing Center Seal -->
  <circle cx="150" cy="122" r="15" fill="#0070F3" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M145 122 L149 126 L156 118" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Holographic Beam Lines -->
  <line x1="150" y1="20" x2="150" y2="60" stroke="#00D2FF" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="150" cy="18" r="4" fill="#FFFFFF" filter="url(#cyanGlow)"/>

  <!-- Orbiting Circuit Dots in Pure White and Cyan -->
  <circle cx="50" cy="100" r="3" fill="#FFFFFF"/>
  <circle cx="250" cy="95" r="3" fill="#00D2FF"/>
  <circle cx="100" cy="45" r="2" fill="#00D2FF" opacity="0.6"/>
  <circle cx="205" cy="45" r="2.5" fill="#FFFFFF" opacity="0.7"/>
</svg>
