<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="100%" height="180" fill="none">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B18"/>
      <stop offset="50%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#020610"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0080FF"/>
      <stop offset="100%" stop-color="#0040C0"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="180" rx="14" fill="url(#cyberBg)"/>
  
  <!-- Perspective Cyber Grid Lines -->
  <g opacity="0.25">
    <line x1="50" y1="180" x2="200" y2="70" stroke="#00D2FF" stroke-width="1"/>
    <line x1="150" y1="180" x2="225" y2="70" stroke="#00D2FF" stroke-width="1"/>
    <line x1="250" y1="180" x2="250" y2="70" stroke="#00D2FF" stroke-width="1"/>
    <line x1="350" y1="180" x2="275" y2="70" stroke="#00D2FF" stroke-width="1"/>
    <line x1="450" y1="180" x2="300" y2="70" stroke="#00D2FF" stroke-width="1"/>
    <ellipse cx="250" cy="140" rx="200" ry="35" stroke="#00D2FF" stroke-width="1" stroke-dasharray="4 4"/>
    <ellipse cx="250" cy="160" rx="230" ry="40" stroke="#00D2FF" stroke-width="1"/>
  </g>

  <!-- Central Holographic Shield -->
  <path d="M250 25 L290 44 C290 85 270 120 250 135 C230 120 210 85 210 44 Z" 
        fill="#071426" stroke="url(#neonBlue)" stroke-width="2.5" filter="url(#neonGlow)"/>

  <!-- Inner Padlock Symbol in White & Neon Blue -->
  <rect x="238" y="74" width="24" height="20" rx="4" fill="#00D2FF"/>
  <path d="M243 74 L243 64 C243 59 257 59 257 64 L257 74" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="250" cy="83" r="2.5" fill="#050B18"/>
  <line x1="250" y1="85" x2="250" y2="89" stroke="#050B18" stroke-width="1.5"/>

  <!-- Orbiting Quantum Rings -->
  <circle cx="250" cy="80" r="62" stroke="#FFFFFF" stroke-opacity="0.2" stroke-dasharray="6 8" stroke-width="1.5"/>
  <circle cx="250" cy="80" r="78" stroke="#00D2FF" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="180" cy="80" r="3" fill="#FFFFFF"/>
  <circle cx="320" cy="80" r="3" fill="#00D2FF"/>
  <circle cx="250" cy="18" r="3" fill="#00D2FF"/>

  <!-- Side Cyber Accents -->
  <path d="M40 90 L110 90 L130 110" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>
  <circle cx="40" cy="90" r="3" fill="#00D2FF"/>
  
  <path d="M460 90 L390 90 L370 110" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>
  <circle cx="460" cy="90" r="3" fill="#00D2FF"/>

  <!-- Binary Data Pulses in Pure White -->
  <text x="60" y="50" fill="#FFFFFF" opacity="0.4" font-family="monospace" font-size="10" letter-spacing="2">01000011 01001001</text>
  <text x="340" y="50" fill="#FFFFFF" opacity="0.4" font-family="monospace" font-size="10" letter-spacing="2">E2EE • AES-256</text>
</svg>
