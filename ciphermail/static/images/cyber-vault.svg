<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="100%" height="140" fill="none">
  <defs>
    <linearGradient id="portalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="50%" stop-color="#08142C"/>
      <stop offset="100%" stop-color="#01040A"/>
    </linearGradient>
    <filter id="portalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="150" rx="12" fill="url(#portalBg)"/>

  <!-- Horizontal Laser Rail -->
  <line x1="20" y1="75" x2="380" y2="75" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Outer Cyber Iris Rings -->
  <circle cx="200" cy="75" r="56" stroke="#00D2FF" stroke-width="1.5" stroke-dasharray="8 6" filter="url(#portalGlow)"/>
  <circle cx="200" cy="75" r="46" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Central Blast Door Core -->
  <circle cx="200" cy="75" r="36" fill="#0A1835" stroke="#00D2FF" stroke-width="2.5"/>
  <circle cx="200" cy="75" r="16" fill="#0070F3" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="200" cy="75" r="5" fill="#FFFFFF"/>

  <!-- Angular Rotating Teeth in Pure White -->
  <line x1="200" y1="45" x2="200" y2="53" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="200" y1="97" x2="200" y2="105" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="170" y1="75" x2="178" y2="75" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="222" y1="75" x2="230" y2="75" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Side Security Access Sensors -->
  <g opacity="0.8">
    <rect x="70" y="65" width="40" height="20" rx="4" fill="#061226" stroke="#00D2FF" stroke-width="1"/>
    <circle cx="90" cy="75" r="4" fill="#00D2FF"/>
    
    <rect x="290" y="65" width="40" height="20" rx="4" fill="#061226" stroke="#00D2FF" stroke-width="1"/>
    <circle cx="310" cy="75" r="4" fill="#00D2FF"/>
  </g>
</svg>
