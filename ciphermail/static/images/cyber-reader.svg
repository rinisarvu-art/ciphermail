<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="260" height="200" fill="none">
  <defs>
    <linearGradient id="docHud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A30"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Data Panel Shadow -->
  <rect x="95" y="35" width="140" height="175" rx="12" fill="#040711" stroke="#00D2FF" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="85" y="45" width="140" height="175" rx="12" fill="url(#docHud)" stroke="#00D2FF" stroke-width="1.5" filter="url(#laserGlow)"/>

  <!-- Scanning Laser Line Across Document -->
  <line x1="75" y1="110" x2="235" y2="110" stroke="#00F0FF" stroke-width="2" filter="url(#laserGlow)"/>
  <circle cx="75" cy="110" r="3" fill="#FFFFFF"/>
  <circle cx="235" cy="110" r="3" fill="#FFFFFF"/>

  <!-- Document Header in Pure White -->
  <rect x="105" y="70" width="65" height="7" rx="3.5" fill="#FFFFFF"/>
  <rect x="105" y="85" width="95" height="4" rx="2" fill="#00D2FF" opacity="0.6"/>

  <!-- Encrypted Payload Data Lines in Blue & White -->
  <rect x="105" y="130" width="100" height="4" rx="2" fill="#FFFFFF" opacity="0.4"/>
  <rect x="105" y="142" width="85" height="4" rx="2" fill="#00D2FF" opacity="0.4"/>
  <rect x="105" y="154" width="92" height="4" rx="2" fill="#FFFFFF" opacity="0.3"/>
  <rect x="105" y="166" width="75" height="4" rx="2" fill="#00D2FF" opacity="0.4"/>

  <!-- Verified Cryptographic Badge -->
  <circle cx="185" cy="185" r="18" fill="#0070F3" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M179 185 L183 189 L192 180" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Targeting Corner Reticles -->
  <path d="M75 55 L75 45 L85 45" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
  <path d="M235 55 L235 45 L225 45" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
  <path d="M75 190 L75 200 L85 200" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
  <path d="M235 190 L235 200 L225 200" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
</svg>
